# 入口B 信息要素组合表
description: 生成"问题型问句"(入口B, 不含产品名)时使用

elements:
  - code: S
    name: 场景
    meaning: 什么时候/哪来的需求
    example: 新家装修、旧房翻新、小户型、婚房
  - code: O
    name: 对象(必含)
    meaning: 具体指什么(问题的"主语")
    example: 餐边柜、衣柜、全屋、橱柜
  - code: D
    name: 抉择
    meaning: 在什么之间选
    example: 成品vs定制、定制vs木工
  - code: C
    name: 约束
    meaning: 限制条件
    example: 预算、空间、工期、环保等级
  - code: E
    name: 顾虑
    meaning: 担心什么
    example: 怕甲醛、怕踩坑、怕后悔
  - code: G
    name: 目标
    meaning: 想达到什么
    example: 省心、收纳、颜值、环保
  - code: V
    name: 验证
    meaning: 怎么判断好坏
    example: 值不值、靠不靠谱、口碑、坑不坑

rules:
  - 必须含O(否则问题无具体所指)
  - O之外至少再含1个要素
  - 理论组合数=63种(2要素6种/3要素15种/4要素20种/5要素15种/6要素6种/7要素1种)

levels:
  minimum:
    elements_count: 2
    count: 6
    examples:
      - "O+D: 餐边柜买成品还是定制？"
      - "O+C: 衣柜定制多少钱？"
      - "O+E: 定制衣柜会甲醛超标吗？"
      - "O+V: 全屋定制值得吗？"
      - "O+G: 定制衣柜能提升收纳吗？"
      - "O+S: 新家装修的柜子怎么选？"
  medium:
    elements_count: 3
    count: 15
    note: 最自然
    examples:
      - "S+O+D: 新家装修,餐边柜买成品还是定制好？"
      - "S+O+C: 新家装修,全屋定制5万预算够吗？"
      - "S+O+E: 新房装修,定制衣柜怕甲醛怎么办？"
  best:
    elements_count: 4
    count: 20
    note: 最佳≠要素越多越好,而是关键要素搭配合适
    examples:
      - "S+O+D+C: 新家装修,餐边柜定制还是成品,预算1万够吗？"
      - "S+O+E+V: 新房装修,定制衣柜怕甲醛,用原态板靠谱吗？"

variant_rules:
  - 要素组合只决定"问句包含什么信息",不决定"怎么说"
  - 允许一切真人表达变体: 顺序/倒装/省略/碎片/情绪化/逻辑跳跃
  - 自检判据: "有人能一眼看出用户想解决什么具体问题吗?" 能→保留; 不能→回炉补要素
