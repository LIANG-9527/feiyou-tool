# B端与C端完整案例模板
b2b:
  brand: 丝路视觉(300556.SZ)
  products:
    - 数字化展览展示综合业务(数字展馆/展厅EPC)
    - 数字内容应用业务(AIGC/沉浸式内容/IP)
    - 云渲染服务(瑞云科技)
  name_variants_example: 官方"数字化展览展示综合业务"→简称"数字展馆"→术语"展览展示工程/展陈EPC"→口语"展厅设计公司"→场景化"党建展厅/城市规划馆设计"→英文"Silkroad CG"
  audience_4_types: G1政府/公共机构; G2大型企业/园区; G3文旅景区; G4科技产业新势力
  journey_6_stages: 需求识别→需求梳理与了解→供应商评估比选→采购决策→实施与交付→运营与续约
  query_characteristics: 偏"选型/合规/工期/招标/验收"(理性决策)
  entry_b_example: "公司想搞个能展示形象和产品的地方,不知道从哪开始"

b2c:
  brand: 好莱客(603898.SH)
  products:
    - 全屋定制(整家定制,营收主力)
    - 原态净醛竹板系列(ENF环保)
    - 高端定制大师系列(海棠、睿境等)
  name_variants_example: 官方"好莱客全屋定制"→简称"好莱客"→术语"全屋定制/整家定制"→口语"定制衣柜品牌"→场景化"装修衣柜怎么选"→英文"Holike"
  audience_4_types: C1新婚/首置装修家庭; C2改善型家庭; C3环保健康敏感人群; C4刚需局部定制
  journey_6_stages: 认知种草→了解→评估→决策下单→安装使用→口碑晒家与复购
  query_characteristics: 偏"价格/环保/后悔/晒家"(情绪+性价比)
  entry_b_example: "新家装修,柜子做定制还是买成品？"

bc_insights:
  - SOP整体流程通用,差异在语料权重(B端重理性合规、C端重情绪性价比)
  - 入口B问题型问句对两端都是"截流蓝海"
  - 品牌推荐可信度验证是B/C端共通的高意图类型
