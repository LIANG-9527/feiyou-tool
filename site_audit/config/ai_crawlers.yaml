groups:
  search_engine:        # A组 检索型-搜索引擎（封禁→不合格：阻断收录）
    - Baiduspider
    - 360Spider
    - Sogou web spider
    - YisouSpider
    - ToutiaoSpider
    - Googlebot
    - Bingbot
    - Applebot
  ai_retrieval:         # A组 检索型-AI检索/实时引用（封禁→不合格：失去引用资格）
    - Bytespider
    - OAI-SearchBot
    - PerplexityBot
    - KimiBot
    - ChatGPT-User
    - Perplexity-User
    - Claude-User
  training:             # B组 训练型（封禁=商业选择，不计分、不出现在问题列表）
    - GPTBot
    - ClaudeBot
    - Google-Extended
    - Cohere-AI
  observer:             # 扩展观察名单（默认不展示）
    - Applebot-Extended
    - Meta-ExternalAgent
    - Amazonbot
    - CCBot
    - MistralAI-User
    - DeepSeekBot
    - TongyiBot
    - ChatGLMBot
    - TencentPR
    - iFlytekBot
    - YuanbaoBot
  on_demand:            # 按需触发型（多数不承诺遵守 robots）
    - Meta-ExternalFetcher
  preview:              # 分享预览类（声明绕过 robots，不参与判定）
    - FacebookBot
    - FacebookExternalHit
