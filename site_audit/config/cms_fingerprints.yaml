# ============================================================
# CMS 指纹特征库 v2
# 改进点：
#   1. 每条特征带 weight 权重，累计达到 min_confidence 才输出
#   2. fingerprint_paths 增加 expect_content 内容校验（GET 请求）
#   3. excludes 互斥规则，implies 依赖推断
#   4. 国内 SaaS 以 CDN 域名/特定资源路径为主特征，纯拼音降权或移除
#   5. 前端框架修复误报（去掉 id="app"、data-reactroot 等泛特征）
#   6. version_extract 版本提取
# ============================================================
# 检测维度说明：
#   meta_generator:  <meta name="generator"> 内容正则匹配
#   html_patterns:   HTML 源码正则匹配（脚本路径、CDN域名、属性等）
#   header_patterns: 响应头键值正则匹配
#   fingerprint_paths: GET 探测路径，校验状态码 + 可选内容
#   cookie_names:    Cookie 名精确匹配（支持 * 后缀通配）
#   version_extract: 从指定来源用正则提取版本号
#   excludes:        命中本平台后排除的平台名列表
#   implies:         命中本平台后自动附加的平台名列表
#   min_confidence:  累计权重达到此值才输出结果（0-100）
# ============================================================

platforms:

  # ========== 国内传统 CMS ==========

  - name: "WordPress"
    type: cms
    min_confidence: 35
    meta_generator:
      - { pattern: "wordpress", weight: 30, flags: "i" }
    html_patterns:
      - { pattern: "wp-content/", weight: 25 }
      - { pattern: "wp-includes/", weight: 25 }
      - { pattern: "/wp-json/", weight: 20 }
      - { pattern: "wp-postpass", weight: 15 }
      - { pattern: "wp-emoji-release", weight: 15 }
    header_patterns:
      - { header: "Link", pattern: "wp-json", weight: 15 }
    fingerprint_paths:
      - { path: "/wp-login.php", expect_status: [200], expect_content: "wordpress", weight: 30, method: GET }
      - { path: "/wp-admin/", expect_status: [200, 302], weight: 15, method: GET }
    cookie_names:
      - { name: "wordpress_logged_in_*", weight: 25 }
      - { name: "wp-settings-*", weight: 15 }
      - { name: "wp-postpass_*", weight: 15 }
    version_extract:
      - { source: meta_generator, regex: "wordpress\\s+([\\d.]+)", flags: "i" }
      - { source: html, regex: "wp-includes/js/jquery/jquery[\\w.-]*\\.js\\?ver=([\\d.]+)" }
    excludes: []
    implies: []
    suitability: "成熟CMS，插件生态丰富，二次开发友好，适合接手整改"

