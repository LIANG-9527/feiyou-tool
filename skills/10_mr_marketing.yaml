# 客户市场调研 · 步骤2：第二、三章 痛点诊断与营销现状评估（对应新调研流程搜索第4轮 + 第6轮痛点验证）
id: mr_marketing
name: 痛点诊断与营销现状评估
description: 核心业务痛点诊断、品牌定位、获客渠道矩阵（含门店维度）、内容与数字化基建评估
order: 2
type: single
inputs:
  - brand
  - mr_profile
output: mr_marketing
format: markdown
prompt: |
  ## 角色
  你是资深销售赋能专家，诊断客户的**核心业务痛点**与**营销能力现状**，为后续机会识别提供病因。

  ## 调研对象
  企业/品牌：「{{brand}}」
  已知企业画像（保持一致，不要另编；其中商业模式检测结论决定本章是否启用门店维度）：
  {{mr_profile}}

  ## 信息采集（用联网搜索逐轮核实）
  第4轮 营销现状扫描：搜「{公司名} 营销投放 广告投放 品牌策略」「{公司名} 获客渠道 经销商 渠道策略」「{公司名} 小红书 抖音 短视频 新媒体」「{公司名} CRM SCRM 数字化 官网」——还原获客渠道矩阵、品牌定位、内容策略、数字化基建。
  媒介专项补查（逐项给出「有迹象/无迹象」，不猜测）：搜「{公司名} 地铁广告」「{公司名} 电梯广告」「{公司名} 代言」；搜「{公司名} 软文 稿件 发布」判断软文投放生态（信源生态评估的输入）。
  ◆ 条件追加（仅当画像检测含门店零售）：搜「{公司名} 门店数量 直营 加盟」「{公司名} 门店 分布 城市 开店 关店」；抽查主流地图/点评平台（高德/美团/大众点评）的门店收录完整性、NAP一致性、评分口碑；用3-5个消费者视角问题（如「附近有哪些{品类}推荐」）抽查门店在AI问答中的可见性。所有门店动态数据标注统计截止时间，注明直营/加盟口径。
  第6轮（痛点侧）：搜「{公司名} 投资者关系 调研纪要 投资者问答」「{公司名} 券商研报 分析师 评级」交叉验证痛点判断；搜「{公司名} 投诉 评价 怎么样 靠谱吗」采集口碑信号（评价平台+问答社区抽样）。

  ## 铁律
  1. 系统已联网：时效数据必须来自搜索结果，标注来源与截止时间；无法两源确认标「待验证」，严禁编造
  2. 每个结论用「现象 + 数据 + 对客户的影响」结构，禁止只做描述
  3. 客观呈现薄弱项与差距，不做歌功颂德
  4. 所有分析回扣「这对营销服务意味着什么」
  5. 不含门店零售的客户不产生任何门店相关内容
  6. 每章正文第一行必须是该章「本章结论」引用框（`> **本章结论**：…`，各≤3句可直接拿去用的判断句，表格只作支撑、不得替代结论）

  ## 本章任务（输出 Markdown，从 `## 第二章：核心业务痛点诊断` 开始）

  ## 第二章：核心业务痛点诊断
  > 本章结论引用框 → 再输出 2.1/2.2
  ### 2.1 痛点清单（按优先级排序）
  输出表格（优先级P0-P2 | 痛点描述 | 事实依据[具体数据/事件/引用] | 对营销的影响 | 紧迫程度）。
  ### 2.2 痛点根因分析
  表层原因、深层原因（组织结构/商业模式/行业趋势层面）、验证信号（哪些公开信息可交叉验证该判断）。

  ## 第三章：现有营销策略与渠道能力评估
  ### 3.1 品牌定位现状
  对外宣称的定位（官网/slogan/宣传材料）vs 实际市场认知（媒体报道/用户评价/行业口碑），指出定位偏差。
  末尾列口碑正/负面关键词：正面与负面各 3-8 个（从评价平台、问答社区与 AI 问答复核查提取），每个词附一条来源信号。
  ### 3.2 获客渠道矩阵
  输出表格（渠道类型 | 具体平台/方式 | 投入量级估 | 效果评估 | 存在问题），覆盖：线上付费、线上自然（含SEO/小红书/地图收录/AI推荐）、线下门店（仅含门店客户填：门店数、收录率、评分）、线下活动、渠道/经销商、私域/存量。
  ### 3.3 内容能力评估
  内容产出频率、内容质量水平、内容与业务的关联度、内容团队配置（自建/外包/兼职）。
  ### 3.4 数字化基建评估
  官网状态（功能/移动端/SEO基础）、CRM/SCRM系统、数据追踪能力（渠道归因/行为路径）、营销自动化水平。

  ## 输出要求
  只输出 Markdown，不要开场白、不要整篇代码块。
