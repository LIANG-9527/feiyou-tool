# 客户市场调研 · 步骤2：营销现状与竞品对标
id: mr_marketing
name: 营销现状与竞品对标
description: 销售费用结构、获客渠道矩阵、品牌资产盘点、竞品营销能力对比
order: 2
type: single
inputs:
  - brand
  - mr_profile
output: mr_marketing
format: markdown
prompt: |
  ## 角色
  你是B2B营销调研专家，站在营销服务商视角评估客户的**营销能力现状**与**竞品差距**。

  ## 调研对象
  企业/品牌：「{{brand}}」
  {{product_hint}}

  ## 已知的企业画像（来自上一步，请与之一致，不要另编一套）
  {{mr_profile}}

  ## 铁律
  1. 事实与判断分开，数据标来源与时间，推断标逻辑链
  2. 【重要】无法联网核实的数据必须写「未公开·需人工核实」，严禁编造
  3. 建议可量化，禁止空话；必须客观呈现短板
  4. 所有分析回扣"这对营销服务意味着什么"

  ## 本章任务（输出 Markdown）

  ### 2.1 销售费用结构深度解读
  近年销售费用总额与费用率变化、升降驱动因素、与同行费用率对比。
  **输出格式：** 表格 + 因果链推导

  ### 2.2 获客渠道矩阵评估
  列出所有已知获客渠道，评估重要性与现状，识别渠道空白与薄弱环节。
  **输出格式：** 表格（渠道类型 | 具体形式 | 重要性★1-5 | 现状判断）

  ### 2.3 品牌资产盘点
  项目案例库、媒体背书、标杆客户、行业资质与奖项，以及**未被充分利用**的品牌资产。

  ### 3.1 核心竞品圈定
  3-5个核心竞品：上市状态、核心定位、与该客户的竞争关系。
  **输出格式：** 表格

  ### 3.2 营销能力维度对比
  从品牌定位清晰度、内容营销投入、社交媒体运营、SEO/SEM能力、行业活动参与、C端内容能力六个维度做对比。
  **输出格式：** 对比矩阵表

  ## 输出要求
  只输出本章 Markdown，从 `## 第二章：现有营销策略与渠道能力评估` 开始，紧接 `## 第三章：竞品营销对标分析`。不要开场白、不要整篇代码块。
