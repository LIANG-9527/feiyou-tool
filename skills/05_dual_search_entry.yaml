# Step 3.5 · 双搜索入口 + 入口B生成规范
id: step3_5
name: 双搜索入口
description: 定义产品名入口和问题入口,含要素组合规则
order: 5
type: single
inputs:
  - step2_personas
  - step3_journey
  - step1_5_variants
output: step3_5_dual_entry
prompt: |
  ## 任务
  真实用户有两条搜索路径,每个阶段都要覆盖:
  - 入口A(产品名入口): 用户已知产品名→直接搜知识、品牌推荐、解决方案、案例
  - 入口B(问题入口): 用户只知道问题/需求→搜解决方案→得知产品名→再进入案例、知识、推荐

  ## 品牌信息
  客群: {{step2_personas}}
  旅程: {{step3_journey}}
  变体: {{step1_5_variants}}

  ## 入口B问句生成规则(信息要素组合表)
  7个要素: S场景/O对象(必含)/D抉择/C约束/E顾虑/G目标/V验证
  有效组合: 必须含O + 至少1个其他要素
  三级标准: 最低(2要素6种)/中(3要素15种,最自然)/最佳(4要素20种)
  要素只决定'包含什么信息',不决定'怎么说',允许顺序/倒装/省略/碎片/情绪化变体
  自检判据: '有人能一眼看出用户想解决什么具体问题吗?'

  ## 要求
  为每个阶段定义双入口方向,并给出入口B的要素组合提示(哪些要素组合最适合该阶段)。

  ## 输出格式(JSON数组,与阶段一一对应)
  [
    {
      "stage_index": 1,
      "entry_a": "产品名入口方向: 用户已知产品名后搜什么",
      "entry_b": "问题入口方向: 用户只知道问题时搜什么",
      "entry_b_combination_hints": ["S+O+D", "O+C+E"]
    }
  ]
