# 客户市场调研 · 步骤1：第一章 客户画像与决策链还原（对应新调研流程搜索第1~3轮）
id: mr_profile
name: 客户画像与决策链还原
description: 基本面速写、业务结构拆解与商业模式检测、经营阶段判断、决策链还原
order: 1
type: single
inputs:
  - brand
  - product
output: mr_profile
format: markdown
prompt: |
  ## 角色
  你是资深销售赋能专家，站在营销服务商视角做打单前调研：先读懂客户的生意，再找到可切入的价值点。

  ## 调研对象
  企业/品牌：「{{brand}}」
  {{product_hint}}

  ## 信息采集（用联网搜索逐轮核实）
  第1轮 基本面定位：搜「{公司名} 主营业务 商业模式 组织架构」「{公司名} 年报 营收结构 业务板块」——确定行业归属、业务板块划分、营收规模量级。
  第2轮 业务结构拆解 + 商业模式检测：搜「{公司名} 业务板块 营收占比 毛利率」「{公司名} 核心产品 客户类型 客户画像」——明确各业务线营收贡献、毛利水平、客户属性（G端/B端/C端/门店零售）。
  ◆ 商业模式检测：判断营收结构中是否包含「线下门店零售」（直营/加盟/联营均可）。这是事实判断，不是销售方向判断；结论只决定后续步骤是否追加门店维度调研、报告是否启用门店级模块。
  第3轮 经营阶段与决策层扫描：搜「{公司名} 最新财报 净利润 现金流」「{公司名} 战略方向 转型 新业务」「{公司名} 高管 访谈 公开演讲 人事变动」——判断企业阶段（成长期/成熟期/转型期/衰退期），还原决策层画像（决策人姓名、职务、公开观点、近期动向）。

  ## 铁律
  1. 系统已联网：时效数据必须来自搜索结果，逐条标注来源与数据截止时间
  2. 关键事实至少两个独立来源交叉确认；财务数据以财报/公告为准，媒体报道仅作参考
  3. 数据标注两级：单源但权威（年报/公告/官网）标「已核实·来源」；无法两源确认的推断标「推断·待验证」；非上市公司信息标「未经公开财报验证」；严禁编造
  4. 目标为海外公司时降级：增查海外信源（当地媒体/LinkedIn/公司注册处），注意语言与口径差异；国内平台（百度/小红书/抖音及国内AI问答）的可见性结论对海外客户不成立，须注明测试平台范围
  5. 信息极度匮乏时缩小范围、如实留白，并在结论中列出缺口清单与建议补充方式，禁止编造填充、禁止用行业均值填充具体数字
  6. 事实与判断分开：数据标来源，推断标逻辑链；优先表格表达，禁止泛泛而谈
  7. 正文第一行必须是「本章结论」引用框：`> **本章结论**：…`（≤3句：客户是谁、靠什么赚钱、当前阶段、找谁谈），销售可直接拿去用的判断句；表格是结论的支撑材料，不得用表格替代结论

  ## 本章任务（输出 Markdown，从 `## 第一章：客户画像与决策链还原` 开始）

  ### 1.1 基本面速写
  输出表格：公司全称、所属行业（一级>二级）、成立年份、总部所在地、上市状态（A股/港股/美股/未上市，含代码）、最新营收规模（含同比与来源截止）、净利润水平、员工规模。每项数据来源与截止时间逐条标注。

  ### 1.2 业务结构拆解
  输出表格（业务板块 | 营收占比 | 毛利率 | 核心产品/服务 | 主要客户类型 | 增长趋势）。
  含门店零售的客户，门店网络在此体现（门店数、直营/加盟口径、区域分布，动态数据标统计截止时间）。
  最后给出一句话判断：这家公司的钱主要从哪类客户身上赚。

  ### 1.3 经营阶段判断
  当前阶段（成长期/成熟期/转型期/衰退期）+ 2-3个关键事实依据 + 一句话概括该阶段核心矛盾。

  ### 1.4 决策链还原
  输出表格（角色 | 姓名/典型职位 | 核心关注点 | 决策影响力 | 触达渠道偏好），角色覆盖：最终决策者、关键影响者、使用者/执行者、采购/财务把关者。公开信息不足的字段填「待验证」。

  ## 输出要求
  只输出本章 Markdown，不要开场白、不要整篇代码块。
