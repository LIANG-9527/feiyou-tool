# 客户市场调研 · 步骤8：企业画像页签的结构化数据（基本信息/架构布局/部门架构/文化/历程/待补清单）
id: mr_brief
name: 企业画像数据
description: 联网核查企业基本信息、架构布局、部门架构、企业文化、发展历程，输出结构化JSON供报告画像页渲染
order: 8
type: single
inputs:
  - brand
  - mr_profile
output: mr_brief
prompt: |
  ## 角色
  你是企业情报研究员，把目标企业的关键事实整理成结构化简报数据。

  ## 调研对象
  企业/品牌：「{{brand}}」
  【客户画像（保持一致，不要另编）】{{mr_profile}}

  ## 铁律
  1. 用联网搜索核实：资质、专利、地址、营收、员工数等逐项找来源；单源权威标「已核实」，两源确认直接给值，查不到的字段填 null，禁止编造
  2. 同名企业以调研对象所在行业/地区为准；拿不准就填 null 并把该字段与补法写入 gaps[]；海外公司增查海外注册处/当地媒体口径
  3. 部门架构只列公开可查的（官网、年报、招聘页、新闻）；查不到部门细分时只保留根节点

  ## 任务：仅输出 JSON（不要任何其他文字）
  {"info":{"full_name":"公司注册全称","founded":"成立时间(YYYY年MM月)","address":"注册地址/总部地址","industry_position":"行业地位一句话(含排名/份额依据)","revenue":"年营收(带年份与单位)","employees":"员工人数(带口径时间)","qualifications":["资质/认证，如高新技术企业、ISO…"],"patents":["代表性专利/软著，最多8条，格式：名称(类型)"]},
   "layout":{"headquarters":"总部所在城市/园区","branches":["分公司/办事处城市"],"subsidiaries":["子公司/关联公司名(一句话)"],"sites":["生产基地/研发中心/门店网点(带数量口径)"]},
   "org_tree":{"name":"根节点(公司或总经理/CEO)","note":"一句话规模说明","children":[{"name":"一级部门/事业部","children":[{"name":"二级机构或核心岗位"}]}]},
   "culture":{"mission":"使命(官方表述)","vision":"愿景(官方表述)","values":"价值观关键词，顿号分隔"},
   "timeline":[{"date":"YYYY 或 YYYY-MM","tag":"成立/融资/上市/并购/投产/转型等","event":"一句话事件"}],
   "gaps":["缺失字段：补全方法（如 部门架构细分：需首访客户确认或查最新年报组织架构页）"]}

  timeline 给 5-12 条，日期口径统一；无精确月份用年份。
