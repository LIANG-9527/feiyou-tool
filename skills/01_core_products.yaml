# Step 1 · 核心产品/服务清单
# 两段式（2026-09-19）：先自由检索拿事实，再照格式整理——实测"调研近半年主推依据"式的
# 结构化任务会把模型逼到按公司名编造；聊天式提问则能正确答出品牌与产品（飞柚实测）。
id: step1
name: 核心产品清单
description: 调研品牌近半年核心产品/服务
order: 1
type: single
inputs:
  - brand
  - product
output: step1_products
research_prompt: |
  「{{brand}}」是一家中国公司。请联网检索并简要回答：
  1. 这家公司对外使用的品牌名叫什么？
  2. 它的核心产品/服务有哪些？产品或系统的名称尽量给出原文。
  {{brand_hint}}
  只依据检索到的公开信息回答，并注明信息来自哪个网站；检索不到就明确说"未检索到公开信息"。不要编造。
prompt: |
  ## 联网调研结论（上游自由检索所得）
  {{research_answer}}

  ## 任务
  基于以上调研结论，整理品牌「{{brand}}」对外推广销售的核心产品/服务清单。

  {{product_hint}}

  ## 要求
  1. 输出1~3个核心产品/服务，只允许整理上方案结中出现的信息
  2. 每个附: 一句话定位、目标客群、主推依据（注明调研结论中的来源网站）
  3. 调研结论为"未检索到"或不含可用产品信息时，输出空数组 []
  4. 如果用户指定了产品/服务,确保该产品在输出列表中,且排在第一位
  5. 禁止根据公司名称、经营范围猜测或补充调研结论之外的产品

  ## 输出格式(JSON数组)
  [
    {
      "product_name": "产品/服务名称",
      "positioning": "一句话定位",
      "target_audience": "目标客群简述",
      "promotion_basis": "主推依据（含来源网站）"
    }
  ]
