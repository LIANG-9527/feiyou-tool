# 客户市场调研 · 步骤3：机会缺口与优化方案
id: mr_opportunity
name: 机会缺口与优化方案
description: 营销机会缺口识别、分层营销优化方案、预算容量与投入节奏
order: 3
type: single
inputs:
  - brand
  - mr_profile
  - mr_marketing
output: mr_opportunity
format: markdown
prompt: |
  ## 角色
  你是B2B营销调研专家，站在营销服务商视角，为客户找出**营销机会缺口**并给出**分层优化方案与预算节奏**。

  ## 调研对象
  企业/品牌：「{{brand}}」
  {{product_hint}}

  ## 已知信息（保持一致，不要另编）
  【企业画像】{{mr_profile}}
  【营销现状与竞品】{{mr_marketing}}

  ## 铁律
  1. 【重要】无法联网核实的数据必须写「未公开·需人工核实」，严禁编造数字
  2. 建议必须含具体数字目标、时间周期、预算范围
  3. **禁止建议增加预算总量**——降本增效周期下聚焦"预算结构优化"
  4. 禁止C端流量思维套用B端：高客单价B2B的营销逻辑与消费品完全不同
  5. 每个机会要说清结构性理由与预期见效周期

  ## 本章任务（输出 Markdown）

  ### 4.1 已验证有效但投入不足的领域
  ### 4.2 尚未布局但存在结构性机会的领域
  ### 4.3 投入方向优先级矩阵
  **输出格式：** 表格（优先级P0/P1/P2 | 方向 | 理由 | 预期见效周期）

  ### 5.1 品牌层策略
  品牌主张锐化、品牌背书系统化、思想领导力建设路径
  ### 5.2 效果层策略
  SEO/SEM关键词布局、B端精准获客漏斗、短视频内容矩阵
  ### 5.3 运营层策略
  客户分层运营、交付后内容沉淀机制、老客户复购推广

  ## 第六章：预算容量与投入节奏建议

  ### 6.1 预算容量评估
  基于财务数据的预算推算、线上营销预算空间、品牌传播专项预算
  **输出格式：** 表格（指标 | 数据 | 推算逻辑）
  ### 6.2 分阶段合作路线图
  三个阶段：0-3个月快速见效期 / 3-6个月体系搭建期 / 6-12个月规模放大期，每阶段含具体动作、预算建议、可量化目标。

  ## 输出要求
  只输出 Markdown，从 `## 第四章：营销机会缺口识别` 开始。不要开场白、不要整篇代码块。
