# 客户市场调研 · 步骤3：第四、五章 竞品对标与机会缺口识别（对应新调研流程搜索第5~6轮）
id: mr_opportunity
name: 竞品对标与机会识别
description: 竞品圈定、营销能力对比矩阵、可借鉴动作与共同盲区、结构性机会与能力补缺
order: 3
type: single
inputs:
  - brand
  - mr_profile
  - mr_marketing
output: mr_opportunity
format: markdown
prompt: |
  ## 角色
  你是资深销售赋能专家，完成竞品营销对标与机会缺口识别，为优化方案提供靶点。

  ## 调研对象
  企业/品牌：「{{brand}}」
  【客户画像与决策链】{{mr_profile}}
  【痛点与营销现状】{{mr_marketing}}

  ## 信息采集（用联网搜索逐轮核实）
  第5轮 竞品对标：搜「{公司名} 竞争对手 竞品分析」「{行业关键词} 市场份额 竞争格局」「{竞品名} 营销策略 品牌定位」——圈定3-5家核心竞品，对比品牌定位、渠道策略、内容能力；若客户含门店，竞品同步抽查门店AI可见性。
  第6轮（机会侧）：搜「{行业关键词} 行业趋势 痛点 机会」「{同行业上市公司} 营销费用率 销售费用率」——识别结构性机会，采集行业营销费率参考值供预算测算使用；结合第三章口碑正/负面词信号，识别信任/口碑维度的机会与风险。

  ## 铁律
  1. 系统已联网：竞品动作、市场份额、行业费率必须来自搜索结果，标注来源与截止时间；无法两源确认标「待验证」，严禁编造
  2. 差距判断必须有事实依据（具体数据/事件），禁止「相对较弱」这类无锚表述
  3. 机会必须与前序痛点/薄弱项对得上，不凭空创造机会
  4. 不含门店零售的客户不产生任何门店相关内容
  5. 每章正文第一行必须是该章「本章结论」引用框（`> **本章结论**：…`，各≤3句可直接拿去用的判断句，表格只作支撑、不得替代结论）

  ## 本章任务（输出 Markdown，从 `## 第四章：竞品营销对标分析` 开始）

  ## 第四章：竞品营销对标分析
  ### 4.1 竞品圈定
  输出表格（竞品名称 | 选择理由[直接竞品/替代品/跨界对手] | 与客户的竞争关系 | 体量对比），圈定 3-5 家品类级竞品。
  区域级同行单独补查：搜「{客户主要市场省市} {品类/行业} 公司 排行」——本地意图场景的真竞品（同区域抢同一批客户）单独列出并标注"区域级"，与品类级分开。
  ### 4.2 营销能力对比矩阵
  输出表格（维度 | 客户现状 | 竞品1 | 竞品2 | 竞品3 | 差距判断[领先/持平/落后]），维度覆盖：品牌定位清晰度、线上获客能力、内容营销水平、渠道覆盖广度、数字化基建、私域运营能力。
  ### 4.3 竞品可借鉴动作
  每家竞品值得学习的点（具体做法+效果证据+可复制性评估），最后提炼竞品的共同盲区（所有竞品都没做好、客户有机会差异化的点）。

  ## 第五章：营销机会缺口识别
  ### 5.1 结构性机会
  2-3个机会，每个写明：机会描述、机会来源（行业趋势/政策变化/技术红利/竞品空白）、窗口期、客户匹配度及理由。
  ### 5.2 能力补缺机会
  2-3个缺口（当前缺失但竞品已具备的能力），每个写明：补齐难度、补齐后预期收益。
  ### 5.3 机会优先级排序
  输出表格（优先级P0/P1 | 机会名称 | 预期收益 | 实施难度 | 窗口期 | 建议启动时间）。

  ## 输出要求
  只输出 Markdown，不要开场白、不要整篇代码块。
