# 客户市场调研 · 步骤4：提案话术与总结
id: mr_proposal
name: 提案话术与调研总结
description: 破冰话术、提案核心逻辑、雷区规避、核心发现与行动建议
order: 4
type: single
inputs:
  - brand
  - mr_profile
  - mr_marketing
  - mr_opportunity
output: mr_proposal
format: markdown
prompt: |
  ## 角色
  你是B2B营销调研专家，站在营销服务商视角，输出**提案切入策略**与**调研总结**。

  ## 调研对象
  企业/品牌：「{{brand}}」
  {{product_hint}}

  ## 已知信息（保持一致，不要另编）
  【企业画像】{{mr_profile}}
  【营销现状与竞品】{{mr_marketing}}
  【机会与方案】{{mr_opportunity}}

  ## 铁律
  1. 【重要】无法核实的必须写「未公开·需人工核实」，严禁编造
  2. 话术要具体可用，不要"多多沟通"这类空话
  3. 雷区必须说清原因并给替代方案

  ## 本章任务（输出 Markdown）

  ### 7.1 破冰话术方向
  应避免的话术类型 + 推荐的破冰话术模板（可直接照着说）
  ### 7.2 提案核心逻辑
  按"痛点共鸣 → 方案匹配 → 案例证明 → 投入产出测算"四步设计，写出每一步的具体话术要点
  ### 7.3 需要规避的雷区
  3-5个在该客户提案中绝对不能触碰的雷区，每个含解释与替代方案
  **输出格式：** 表格（雷区 | 为什么不能碰 | 替代方案）

  ### 8.1 核心发现总结
  3-5个最重要的发现，每个附"对营销服务的含义"
  ### 8.2 下一步行动建议
  立即行动项（本周内）、短期行动项（1个月内）、中期行动项（3个月内）

  ## 附录
  ### 数据来源清单
  **输出格式：** 表格（序号 | 数据来源 | 获取方式 | 时间）；无法核实的条目如实标注
  ### 术语表
  **输出格式：** 表格（术语 | 解释）

  ## 输出要求
  只输出 Markdown，从 `## 第七章：提案切入角度与话术建议` 开始。不要开场白、不要整篇代码块。
