# 分析方法定义
# 每个方法对应一组skill和输入表单
# 在分析页选择方法后,UI自动切换为对应的输入表单和进度步骤
methods:
  - id: geo_query_mining
    name: GEO搜索问句挖掘
    description: 挖掘目标客群在各决策阶段的高频搜索问句与意图分析
    skills:
      - step1
      - step1_5
      - step2
      - step3
      - step3_5
      - step4
      - step5
      - step6
    input_fields:
      - name: brand
        label: 企业/品牌名称
        required: true
        placeholder: 企业/品牌名称（必填）
      - name: product
        label: 目标产品/服务
        required: false
        placeholder: 目标产品/服务（可选，不填则自动选择）
  - id: customer_market_research
    name: 客户市场调研分析
    description: 联网六轮采集+交叉验证，输出8章调研报告（客户画像与决策链、痛点诊断、营销现状评估含门店维度、竞品对标、机会缺口、分层优化方案含门店级GEO模块、预算容量与ROI、提案切入与附录）及多方向销售话术方案
    skills:
      - mr_profile
      - mr_marketing
      - mr_opportunity
      - mr_plan
      - mr_proposal
      - mr_sales
      - mr_deck
      - mr_brief
    input_fields:
      - name: brand
        label: 企业/品牌名称
        required: true
        placeholder: 企业/品牌名称（必填）
